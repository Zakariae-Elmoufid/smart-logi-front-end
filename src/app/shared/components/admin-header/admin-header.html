<header class="bg-white shadow-lg border-b border-gray-100 px-6 py-4 sticky top-0 z-50 backdrop-blur-sm bg-white/95">
  <div class="flex items-center justify-between">

    <!-- Left Side -->
    <div class="flex items-center space-x-4">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">Admin Dashboard</h2>
        <p class="text-sm text-gray-500">{{ getCurrentDate() }}</p>
      </div>
    </div>

    <!-- Right Side -->
    <div class="flex items-center space-x-6">

      <!-- Search Button -->
      <button
        class="p-3 text-gray-500 hover:text-primary hover:bg-primary/10 rounded-xl transition-all duration-200 group">
        <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </button>

      <!-- Notifications -->
      <div class="relative">
        <button (click)="toggleNotifications()"
          class="p-3 text-gray-500 hover: text-primary hover:bg-primary/10 rounded-xl transition-all duration-200 group relative">
          <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>

          <!-- Notification Badge -->
          <span *ngIf="notificationCount > 0"
            class="absolute -top-1 -right-1 w-5 h-5 bg-danger text-white text-xs rounded-full flex items-center justify-center font-semibold animate-pulse">
            {{ notificationCount }}
          </span>
        </button>

        <!-- Notifications Dropdown -->
        <div *ngIf="showNotifications"
          class="absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-xl border border-gray-200 py-2 z-50"
          [@slideInOut]>
          <div class="px-4 py-3 border-b border-gray-100">
            <h3 class="text-lg font-semibold text-gray-900">Notifications</h3>
            <p class="text-sm text-gray-500">{{ notificationCount }} nouvelles notifications</p>
          </div>

          <div class="max-h-96 overflow-y-auto">
            <div *ngFor="let notification of notifications"
              class="px-4 py-3 hover: bg-gray-50 cursor-pointer border-l-4 transition-colors" [class]="notification.type === 'urgent' ? 'border-l-danger bg-red-50/30' :
                          notification.type === 'warning' ? 'border-l-warning bg-yellow-50/30' :
                          'border-l-primary bg-blue-50/30'">
              <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center" [class]="notification.type === 'urgent' ?  'bg-danger/20 text-danger' :
                              notification.type === 'warning' ? 'bg-warning/20 text-warning' :
                              'bg-primary/20 text-primary'">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path *ngIf="notification.type === 'urgent'" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2" d="M12 9v2m0 4h. 01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    <path *ngIf="notification.type === 'warning'" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    <path *ngIf="notification.type === 'info'" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-gray-900 truncate">{{ notification.title }}</p>
                  <p class="text-sm text-gray-600 mt-1">{{ notification.message }}</p>
                  <p class="text-xs text-gray-400 mt-2">{{ notification.time }}</p>
                </div>
              </div>
            </div>
          </div>

          <div class="px-4 py-3 border-t border-gray-100">
            <button
              class="w-full text-sm text-primary hover:text-primary-hover font-medium py-2 rounded-lg hover:bg-primary/5 transition-colors">
              Voir toutes les notifications
            </button>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <button
        class="p-3 text-gray-500 hover:text-primary hover:bg-primary/10 rounded-xl transition-all duration-200 group">
        <svg class="w-5 h-5 group-hover:rotate-90 group-hover:scale-110 transition-all duration-300" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-. 94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-. 826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>

      <!-- User Profile -->
      <div class="relative">
        <button (click)="toggleProfile()"
          class="flex items-center space-x-3 px-4 py-2 bg-gradient-to-r from-gray-50 to-gray-100 hover:from-primary/10 hover:to-primary/5 rounded-xl transition-all duration-200 border border-gray-200 hover:border-primary/20 group">

          <!-- Avatar -->
          <div
            class="w-8 h-8 bg-gradient-to-br from-primary to-primary-dark rounded-lg flex items-center justify-center shadow-sm group-hover:shadow-md transition-shadow">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>

          <!-- User Info -->
          <div class="text-left">
            <div class="text-sm font-semibold text-gray-900 group-hover:text-primary transition-colors">{{ userName }}
            </div>
            <div class="text-xs text-gray-500">{{ userRole }}</div>
          </div>

          <!-- Dropdown Arrow -->
          <svg class="w-4 h-4 text-gray-400 group-hover:text-primary transition-all duration-200"
            [class.rotate-180]="showProfile" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Profile Dropdown -->
        <div *ngIf="showProfile"
          class="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-gray-200 py-2 z-50"
          [@slideInOut]>

          <!-- Profile Header -->
          <div class="px-4 py-3 border-b border-gray-100">
            <div class="flex items-center space-x-3">
              <div
                class="w-12 h-12 bg-gradient-to-br from-primary to-primary-dark rounded-xl flex items-center justify-center shadow-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <div>
                <div class="text-sm font-semibold text-gray-900">{{ userName }}</div>
                <div class="text-xs text-gray-500">{{ userEmail }}</div>
                <div class="flex items-center space-x-1 mt-1">
                  <div class="w-2 h-2 bg-success rounded-full animate-pulse"></div>
                  <span class="text-xs text-success font-medium">En ligne</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Profile Menu Items -->
          <div class="py-2">
            <a href="#"
              class="flex items-center space-x-3 px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-primary transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span class="text-sm">Mon Profil</span>
            </a>

            <a href="#"
              class="flex items-center space-x-3 px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-primary transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M10. 325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-. 826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span class="text-sm">Paramètres</span>
            </a>

            <a href="#"
              class="flex items-center space-x-3 px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-primary transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-. 994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span class="text-sm">Aide & Support</span>
            </a>
          </div>

          <!-- Logout -->
          <div class="border-t border-gray-100 pt-2">
            <button (click)="logout()"
              class="flex items-center space-x-3 px-4 py-2 text-red-600 hover:bg-red-50 transition-colors w-full text-left">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              <span class="text-sm font-medium">Déconnexion</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</header>

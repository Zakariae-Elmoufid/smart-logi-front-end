<aside
  class="w-80 h-screen bg-gradient-to-br from-slate-800 via-slate-700 to-slate-800 shadow-2xl relative overflow-hidden">

  <!-- Background Effects -->
  <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>
  <div class="absolute inset-0 pointer-events-none"
    style="background:  linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(29, 78, 216, 0.05));"></div>

  <!-- Logo Section -->
  <div class="relative z-10 p-2 border-b border-white/10">
    <div class="flex items-center space-x-4">
      <div class="w-12 h-12 bg-gradient-primary rounded-xl flex items-center justify-center shadow-lg">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div>
        <h3 class="text-2xl font-bold text-white tracking-tight">ADMIN</h3>
        <p class="text-sm font-medium text-primary-light">Control Panel</p>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="relative z-10 p-2 space-y-3 mt-2">

    <!-- Dashboard -->
    <a routerLink="/admin" routerLinkActive="bg-gradient-primary text-white shadow-lg"
      [routerLinkActiveOptions]="{exact: true}"
      class="group flex items-center space-x-4 p-4 text-gray-300 rounded-2xl hover:bg-white/10 hover:text-white transition-all duration-300 hover:translate-x-1">

      <div
        class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center group-hover:bg-primary/20 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
        </svg>
      </div>

      <div class="flex-1">
        <span class="text-lg font-semibold">Dashboard</span>
        <p class="text-xs text-gray-400 group-hover:text-primary-light transition-colors">Vue d'ensemble</p>
      </div>

      <svg class="w-5 h-5 text-primary transform group-hover:translate-x-1 transition-transform duration-300"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>

    <!-- Users -->
    <a routerLink="/admin/users" routerLinkActive="bg-gradient-primary text-white shadow-lg"
      class="group flex items-center space-x-4 p-4 text-gray-300 rounded-2xl hover:bg-white/10 hover:text-white transition-all duration-300 hover:translate-x-1">

      <div
        class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center group-hover:bg-secondary/20 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </div>

      <div class="flex-1">
        <span class="text-lg font-semibold">Utilisateurs</span>
        <p class="text-xs text-gray-400 group-hover:text-secondary transition-colors">Gestion des comptes</p>
      </div>

      <svg class="w-5 h-5 text-secondary transform group-hover:translate-x-1 transition-transform duration-300"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>

    <!-- Products -->
    <a routerLink="/admin/products" routerLinkActive="bg-gradient-primary text-white shadow-lg"
      class="group flex items-center space-x-4 p-4 text-gray-300 rounded-2xl hover:bg-white/10 hover:text-white transition-all duration-300 hover:translate-x-1">

      <div
        class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center group-hover:bg-warning/20 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>

      <div class="flex-1">
        <span class="text-lg font-semibold">Produits</span>
        <p class="text-xs text-gray-400 group-hover:text-warning transition-colors">Catalogue & stock</p>
      </div>

      <svg class="w-5 h-5 text-warning transform group-hover:translate-x-1 transition-transform duration-300"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>

    <!-- Managers -->
    <a routerLink="/admin/managers" routerLinkActive="bg-gradient-primary text-white shadow-lg"
      class="group flex items-center space-x-4 p-4 text-gray-300 rounded-2xl hover:bg-white/10 hover:text-white transition-all duration-300 hover:translate-x-1">

      <div
        class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center group-hover:bg-purple-500/20 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </div>

      <div class="flex-1">
        <span class="text-lg font-semibold">Gestionnaires</span>
        <p class="text-xs text-gray-400 group-hover:text-purple-400 transition-colors">Gestion des entrepôts</p>
      </div>

      <svg class="w-5 h-5 text-purple-400 transform group-hover:translate-x-1 transition-transform duration-300"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>

    <!-- Categories -->
    <a routerLink="/admin/categories" routerLinkActive="bg-gradient-primary text-white shadow-lg"
      class="group flex items-center space-x-4 p-4 text-gray-300 rounded-2xl hover:bg-white/10 hover:text-white transition-all duration-300 hover:translate-x-1">

      <div
        class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center group-hover:bg-teal-500/20 transition-all duration-300">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
        </svg>
      </div>

      <div class="flex-1">
        <span class="text-lg font-semibold">Catégories</span>
        <p class="text-xs text-gray-400 group-hover:text-teal-400 transition-colors">Gestion des catégories</p>
      </div>

      <svg class="w-5 h-5 text-teal-400 transform group-hover:translate-x-1 transition-transform duration-300"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>

  </nav>

  <!-- Bottom Section -->
  <div class="absolute bottom-8 left-6 right-6 z-10">
    <!-- User Info -->
    <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-4 mb-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-primary rounded-xl flex items-center justify-center shadow-lg">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <div>
          <p class="text-white font-semibold text-sm">Admin User</p>
          <div class="flex items-center space-x-1">
            <div class="w-2 h-2 bg-success rounded-full animate-pulse-primary"></div>
            <p class="text-xs text-primary-light">En ligne</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Button -->
    <button
      class="w-full flex items-center space-x-4 p-4 text-gray-300 hover:text-white hover:bg-white/10 rounded-xl transition-all duration-300 group">
      <div
        class="w-8 h-8 bg-white/10 rounded-lg flex items-center justify-center group-hover:bg-primary/20 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-. 826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-. 426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <span class="text-sm font-medium">Paramètres</span>
    </button>
  </div>

  <!-- Decorative Elements -->
  <div class="absolute top-32 -right-16 w-32 h-32 rounded-full blur-2xl pointer-events-none"
    style="background: radial-gradient(circle, rgba(59, 130, 246, 0.1), transparent);"></div>
</aside>

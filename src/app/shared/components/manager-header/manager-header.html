<header class="bg-white shadow-sm border-b border-gray-100 px-6 py-4 sticky top-0 z-50">
    <div class="flex items-center justify-between">
        <!-- Left Side -->
        <div>
            <h2 class="text-2xl font-bold text-gray-900">Dashboard Manager</h2>
            <p class="text-sm text-gray-500">{{ getCurrentDate() }}</p>
        </div>

        <!-- Right Side -->
        <div class="flex items-center space-x-6">
            <!-- Notifications -->
            <button class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg relative">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                <span
                    class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
            </button>

            <!-- User Profile -->
            <div class="flex items-center space-x-3 pl-6 border-l border-gray-200">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-semibold text-gray-900">Warehouse Manager</p>
                    <p class="text-xs text-gray-500">manager@smartlogi.com</p>
                </div>
                <div
                    class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 font-bold border-2 border-white shadow-sm">
                    WM
                </div>
            </div>
        </div>
    </div>
</header>

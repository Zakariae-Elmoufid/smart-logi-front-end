<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="fixed inset-0 bg-black/30 backdrop-blur-sm transition-opacity" (click)="onClose()"></div>

    <div class="flex min-h-full items-center justify-center p-4">
        <div class="relative w-full max-w-md transform rounded-2xl bg-white p-6 text-left shadow-xl transition-all">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-gray-900">Enregistrer un mouvement</h3>
                <button (click)="onClose()" class="text-gray-400 hover:text-gray-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                <p class="text-sm text-gray-500">Produit</p>
                <p class="font-semibold text-gray-900">{{ inventoryItem?.productName }}</p>
                <div class="flex justify-between mt-2 text-sm">
                    <span class="text-gray-500">Entrepôt: <span class="text-gray-900 font-medium">{{
                            inventoryItem?.warehouseName }}</span></span>
                    <span class="text-gray-500">Actuel: <span class="text-gray-900 font-medium">{{
                            inventoryItem?.quantityOnHand }}</span></span>
                </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="backendErrors" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">Erreur</h3>
                        <div class="mt-2 text-sm text-red-700">
                            {{ backendErrors['message'] || backendErrors['error'] || 'Une erreur est survenue' }}
                        </div>
                    </div>
                </div>
            </div>


            <form [formGroup]="movementForm" (ngSubmit)="onSubmit()" class="space-y-4">
                <!-- Type -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type de mouvement</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" formControlName="type" value="INBOUND" class="peer sr-only">
                            <div
                                class="text-center py-2 px-3 rounded-lg border border-gray-200 peer-checked:bg-green-50 peer-checked:border-green-500 peer-checked:text-green-700 hover:bg-gray-50 transition-all font-medium text-sm">
                                Entrée
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" formControlName="type" value="OUTBOUND" class="peer sr-only">
                            <div
                                class="text-center py-2 px-3 rounded-lg border border-gray-200 peer-checked:bg-orange-50 peer-checked:border-orange-500 peer-checked:text-orange-700 hover:bg-gray-50 transition-all font-medium text-sm">
                                Sortie
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" formControlName="type" value="ADJUSTMENT" class="peer sr-only">
                            <div
                                class="text-center py-2 px-3 rounded-lg border border-gray-200 peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 hover:bg-gray-50 transition-all font-medium text-sm">
                                Ajustement
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Quantity -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Quantité</label>
                    <input type="number" formControlName="quantity" min="1"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all"
                        placeholder="0" [class.border-red-300]="f['quantity'].touched && f['quantity'].invalid">
                    <div *ngIf="f['quantity'].touched && f['quantity'].invalid" class="mt-1 text-xs text-red-500">
                        La quantité doit être supérieure à 0
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" (click)="onClose()"
                        class="px-4 py-2 text-gray-700 bg-gray-50 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                        Annuler
                    </button>
                    <button type="submit" [disabled]="isSubmitting"
                        class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                        <svg *ngIf="isSubmitting" class="animate-spin h-4 w-4 text-white" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        {{ isSubmitting ? 'Enregistrement...' : 'Confirmer' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

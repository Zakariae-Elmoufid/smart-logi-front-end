<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/30 backdrop-blur-sm transition-opacity" (click)="onClose()"></div>

    <div class="flex min-h-full items-center justify-center p-4">
        <div class="relative w-full max-w-4xl transform rounded-2xl bg-white p-6 text-left shadow-xl transition-all">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-900">Nouveau Bon de Commande</h3>
                <button (click)="onClose()" class="text-gray-400 hover:text-gray-500 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Error Message -->
            <div *ngIf="backendErrors" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">Erreur</h3>
                        <div class="mt-2 text-sm text-red-700">
                            {{ backendErrors['message'] || 'Une erreur est survenue' }}
                        </div>
                    </div>
                </div>
            </div>

            <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="space-y-6">
                <!-- Main Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Supplier -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fournisseur</label>
                        <select formControlName="supplierId"
                            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all"
                            [class.border-red-300]="f['supplierId'].touched && f['supplierId'].invalid">
                            <option value="">Sélectionner un fournisseur</option>
                            <option *ngFor="let s of suppliers" [value]="s.id">{{ s.supplierName }}</option>
                        </select>
                        <div *ngIf="f['supplierId'].touched && f['supplierId'].invalid"
                            class="mt-1 text-xs text-red-500">
                            Requis
                        </div>
                    </div>

                    <!-- Warehouse -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Entrepôt de destination</label>
                        <select formControlName="warehouseId"
                            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all"
                            [class.border-red-300]="f['warehouseId'].touched && f['warehouseId'].invalid">
                            <option value="">Sélectionner un entrepôt</option>
                            <option *ngFor="let w of warehouses" [value]="w.id">{{ w.name }}</option>
                        </select>
                        <div *ngIf="f['warehouseId'].touched && f['warehouseId'].invalid"
                            class="mt-1 text-xs text-red-500">
                            Requis
                        </div>
                    </div>

                    <!-- Expected Date -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date prévue</label>
                        <input type="datetime-local" formControlName="expectedDate"
                            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all"
                            [class.border-red-300]="f['expectedDate'].touched && f['expectedDate'].invalid">
                        <div *ngIf="f['expectedDate'].touched && f['expectedDate'].invalid"
                            class="mt-1 text-xs text-red-500">
                            Requis
                        </div>
                    </div>
                </div>

                <!-- Order Lines -->
                <div class="border-t border-gray-200 pt-6">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-lg font-medium text-gray-900">Lignes de commande</h4>
                        <button type="button" (click)="addLine()"
                            class="text-sm text-purple-600 font-semibold hover:bg-purple-50 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            Ajouter un produit
                        </button>
                    </div>

                    <div formArrayName="liens" class="space-y-3">
                        <div *ngFor="let line of liens.controls; let i = index" [formGroupName]="i"
                            class="flex items-start gap-4 p-4 bg-gray-50 rounded-xl border border-gray-200 relative group hover:border-purple-200 transition-colors">

                            <!-- Product -->
                            <div class="flex-1">
                                <label class="block text-xs font-medium text-gray-500 mb-1">Produit</label>
                                <select formControlName="productId"
                                    class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none">
                                    <option value="">Choisir...</option>
                                    <option *ngFor="let p of products" [value]="p.id">{{ p.name }} ({{ p.sku }})
                                    </option>
                                </select>
                            </div>

                            <!-- Quantity -->
                            <div class="w-32">
                                <label class="block text-xs font-medium text-gray-500 mb-1">Quantité</label>
                                <input type="number" formControlName="quantity" min="1"
                                    class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none"
                                    placeholder="Qty">
                            </div>

                            <!-- Delete -->
                            <button type="button" (click)="removeLine(i)"
                                class="mt-6 text-gray-400 hover:text-red-500 transition-colors p-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div *ngIf="liens.length === 0"
                        class="text-center py-6 text-gray-500 text-sm bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        Aucune ligne ajoutée. Ajoutez au moins un produit.
                    </div>
                    <div *ngIf="orderForm.hasError('noLines') && orderForm.touched"
                        class="mt-2 text-sm text-red-600 text-center">
                        Veuillez ajouter au moins une ligne de commande.
                    </div>
                </div>


                <!-- Actions -->
                <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
                    <button type="button" (click)="onClose()"
                        class="px-4 py-2 text-gray-700 bg-gray-50 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                        Annuler
                    </button>
                    <button type="submit" [disabled]="isSubmitting"
                        class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                        <svg *ngIf="isSubmitting" class="animate-spin h-4 w-4 text-white" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        {{ isSubmitting ? 'Traitement...' : 'Créer la commande' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
